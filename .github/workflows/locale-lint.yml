name: Locale check

# Checks that the locale files are consistent.

on:
  push:
  pull_request:

jobs:
  locale-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.1'

      - name: Run locale check
        run: lua tests/locale_lint.lua
