name: Package and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract current version changelog
        run: |
          # Extract from the first version header to the next.
          # Robust to both legacy and current heading formats:
          #   ## v2.3.3 (...)
          #   ## Homestead v2.3.40 (...)
          #   ## Homestead v2.3.31 HOTFIX (...)
          awk '/^## (Homestead )?v[0-9]/{if(found) exit; found=1} found' CHANGELOG.md > RELEASE_NOTES.md

          # Validate: file must be non-empty (catches regex mismatch).
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md is empty after extraction."
            echo "Expected heading pattern in CHANGELOG.md: '## [Homestead ]vX.Y.Z'"
            echo "First 10 lines of CHANGELOG.md:"
            head -10 CHANGELOG.md
            exit 1
          fi

          # Validate: extracted heading must match the tag being released
          # (catches the case where CHANGELOG.md wasn't updated for this release).
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! head -1 RELEASE_NOTES.md | grep -q "v${TAG_VERSION}"; then
            echo "::error::Extracted release notes don't match tag ${GITHUB_REF_NAME}."
            echo "Extracted first line: $(head -1 RELEASE_NOTES.md)"
            echo "Expected version: v${TAG_VERSION}"
            echo "Did you forget to write the v${TAG_VERSION} entry to CHANGELOG.md?"
            exit 1
          fi

          echo "--- Extracted markdown for ${GITHUB_REF_NAME} ---"
          cat RELEASE_NOTES.md

          # Convert markdown to HTML for the upload.
          # CurseForge's API claims to accept changelogType: markdown but renders
          # it as plain text (collapses newlines, shows ## and --- as literal
          # characters). Wago accepts HTML and renders it correctly, so HTML
          # works for both platforms. GitHub Release notes are also fine with
          # inline HTML inside the body. Pre-converting in CI keeps a single
          # markdown source of truth (CHANGELOG.md) while shipping a format CF
          # actually renders. BigWigs packager does NOT pandoc-convert for CF
          # (release.sh's pandoc branch is wowi-only), so this conversion has
          # to happen here.
          if ! command -v pandoc &>/dev/null; then
            echo "pandoc not preinstalled — installing"
            sudo apt-get update -qq && sudo apt-get install -y pandoc
          fi
          pandoc --wrap=none -f commonmark -t html RELEASE_NOTES.md -o RELEASE_NOTES.html

          echo "--- Converted HTML uploaded to CurseForge / Wago ---"
          cat RELEASE_NOTES.html

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
