name: Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the newest-tag guard; run the workflow from the tag ref you want to publish.'
        required: false
        type: boolean
        default: false

# Serialize releases: a bulk tag push fires this workflow once per tag ref, so
# two runs can be in flight at once. Without serialization they race to be the
# last CurseForge upload — and the loser's version is what players get. One
# release publishes at a time; never cancel an upload that is already running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Guard against a stale tag re-triggering the uploader. A bulk tag push
      # (e.g. `git push --tags`, or re-pushing previously-deleted tags) fires
      # this workflow once per tag ref — including OLD versions. Whichever run
      # finishes last becomes the newest file on CurseForge/Wago, so an old tag
      # can silently overwrite a newer release (a sibling addon hit exactly this
      # on 2026-06-01). Only the highest version tag in the repo is allowed to
      # publish. See the "never git push --tags" rule in CLAUDE.md.
      # versionsort.suffix makes "vX.Y.Z-rc1" sort BEFORE "vX.Y.Z" so a final
      # release is never blocked by its own prerelease tag.
      - name: Guard — only the newest tag may publish
        id: guard
        run: |
          TAG="${{ github.ref_name }}"
          # Highest version = first line of the version-sorted tag list. Read
          # into a var and slice the first line rather than piping to `head`,
          # so an early-closed pipe can't trip `set -o pipefail` (no SIGPIPE).
          ALL_TAGS=$(git -c versionsort.suffix=-alpha \
                         -c versionsort.suffix=-beta \
                         -c versionsort.suffix=-rc \
                         -c versionsort.suffix=-wago \
                         tag --sort=-v:refname --list 'v*')
          NEWEST="${ALL_TAGS%%$'\n'*}"
          echo "Triggering tag:     $TAG"
          echo "Newest tag in repo: $NEWEST"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # -wago tags are always intentional hotfixes pushed manually;
          # skip the newest-tag guard for them (versionsort doesn't reliably
          # place them relative to standard semver tags).
          IS_WAGO_TAG=false
          if [[ "$TAG" == *"-wago" ]]; then IS_WAGO_TAG=true; fi

          if [ "$TAG" = "$NEWEST" ] || [ "${{ inputs.force }}" = "true" ] || [ "$IS_WAGO_TAG" = "true" ]; then
            if [ "$TAG" != "$NEWEST" ] && [ "${{ inputs.force }}" != "true" ]; then
              echo "::notice::Wago-only tag $TAG bypassing newest-tag guard (guard applies to standard semver tags only)."
            elif [ "$TAG" != "$NEWEST" ]; then
              echo "::warning::Publishing $TAG via force override even though $NEWEST is newer."
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is not the newest tag ($NEWEST); skipping packaging and CurseForge/Wago upload to avoid publishing an older build over a newer one. Re-run from the Actions tab with force=true if this is a deliberate re-publish."
          fi

      - name: Extract current version changelog
        if: steps.guard.outputs.publish == 'true'
        run: |
          # Extract from the first version header to the next.
          # Robust to both legacy and current heading formats:
          #   ## v2.3.3 (...)
          #   ## Homestead v2.3.40 (...)
          #   ## Homestead v2.3.31 HOTFIX (...)
          awk '/^## (Homestead )?v[0-9]/{if(found) exit; found=1} found' CHANGELOG.md > RELEASE_NOTES.md

          # Validate: file must be non-empty (catches regex mismatch).
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md is empty after extraction."
            echo "Expected heading pattern in CHANGELOG.md: '## [Homestead ]vX.Y.Z'"
            echo "First 10 lines of CHANGELOG.md:"
            head -10 CHANGELOG.md
            exit 1
          fi

          # Validate: extracted heading must match the tag being released
          # (catches the case where CHANGELOG.md wasn't updated for this release).
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! head -1 RELEASE_NOTES.md | grep -q "v${TAG_VERSION}"; then
            echo "::error::Extracted release notes don't match tag ${GITHUB_REF_NAME}."
            echo "Extracted first line: $(head -1 RELEASE_NOTES.md)"
            echo "Expected version: v${TAG_VERSION}"
            echo "Did you forget to write the v${TAG_VERSION} entry to CHANGELOG.md?"
            exit 1
          fi

          echo "--- Extracted markdown for ${GITHUB_REF_NAME} ---"
          cat RELEASE_NOTES.md

          # Convert markdown to HTML for the upload.
          # CurseForge's API claims to accept changelogType: markdown but renders
          # it as plain text (collapses newlines, shows ## and --- as literal
          # characters). Wago accepts HTML and renders it correctly, so HTML
          # works for both platforms. GitHub Release notes are also fine with
          # inline HTML inside the body. Pre-converting in CI keeps a single
          # markdown source of truth (CHANGELOG.md) while shipping a format CF
          # actually renders. BigWigs packager does NOT pandoc-convert for CF
          # (release.sh's pandoc branch is wowi-only), so this conversion has
          # to happen here.
          if ! command -v pandoc &>/dev/null; then
            echo "pandoc not preinstalled — installing"
            sudo apt-get update -qq && sudo apt-get install -y pandoc
          fi
          pandoc --wrap=none -f commonmark -t html RELEASE_NOTES.md -o RELEASE_NOTES.html

          echo "--- Converted HTML uploaded to CurseForge / Wago ---"
          cat RELEASE_NOTES.html

      - name: Package and Release — CurseForge + GitHub
        if: steps.guard.outputs.publish == 'true' && !contains(github.ref_name, '-wago')
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail -a 0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Release — Wago (wago-only tag, creates GitHub Release)
        if: steps.guard.outputs.publish == 'true' && contains(github.ref_name, '-wago')
        uses: BigWigsMods/packager@v2
        with:
          args: -m .pkgmeta.wago -g retail -p 0
        env:
          # WAGO_API_TOKEN intentionally absent: only GITHUB_OAUTH so the packager
          # creates a GitHub Release; Wago's webhook fires on the Release and
          # delivers the package. Passing both would double-publish.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Release — Wago (standard tag, GitHub Release already created)
        if: steps.guard.outputs.publish == 'true' && !contains(github.ref_name, '-wago')
        uses: BigWigsMods/packager@v2
        with:
          args: -m .pkgmeta.wago -g retail -p 0
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
