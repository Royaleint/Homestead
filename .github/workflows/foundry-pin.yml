name: Foundry PIN

# Checks that the embedded Foundry-1.0 is the unmodified tagged release listed
# in Libs/Foundry-1.0/PIN, with no extra files beside it.

on:
  push:
  pull_request:

jobs:
  foundry-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Foundry PIN
        working-directory: Libs/Foundry-1.0
        run: |
          sha256sum -c PIN
          expected="$(grep -E '^[0-9a-f]{64}  ' PIN | cut -c67- | sort)"
          actual="$(find . -type f ! -path './PIN' -printf '%P\n' | sort)"
          extra="$(comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$expected"))"
          test -z "$extra" || { printf 'Unpinned vendored files:\n%s\n' "$extra" >&2; exit 1; }
